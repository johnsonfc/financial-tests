#
# Data as of the Oct 2, 2026 close ($167.03). Every figure comes from
# FTAI_Company_Evaluation.md (evaluation; sources in its Appendix B) or
# FTAI_Bull_Bear_Theses.md (theses). Speaker notes name the source for each slide.
# Inline markup:  **bold**   __bold + underline__

title: FTAI Aviation - Bull/Bear Debate and Evaluation
author: Equity Research

brand:
  font: Garamond                 # use "EB Garamond" if the deck will be opened in Google Slides
  target_name: FTAI Aviation     # no logo file: the builder sets the name as a wordmark
  sponsor_name: Equity Research

sections: [Debate, Company, Industry, Growth Legs, Valuation, Risks]

slides:
  - type: cover
    ticker: "NASDAQ: FTAI"
    kpis: ["Price: $167.03 (Oct 2, 2026)", "Verdict: Pass", "24-Month Value: $181 (+8%)"]
    byline: Bull-Bear Debate and Company Evaluation
    date: Data as of the October 2, 2026 close
    notes: >-
      Verdict: pass. The price already assumes management's 2027 plan arrives on time and then grows
      ~1.9% a year forever (10% WACC). The 24-month probability-weighted value is ~$181 (+8%, ~4%/yr),
      below a ~10% cost of equity. Sources: FTAI_Company_Evaluation.md and FTAI_Bull_Bear_Theses.md.

  - type: agenda                 # items default to the divider titles below

  # ------------------------------------------------------------------ I. Debate
  - type: divider
    title: "The Debate: Bear vs. Bull"

  - type: content
    title: Consensus Baseline & Scorecard
    section: Debate
    notes: >-
      Consensus: MarketBeat (9/23/26) rating split and mean target; short interest from MarketBeat
      (single source). Price-implied growth from the reverse DCF (10% WACC, 76% steady-state cash
      conversion, $20.6B diluted EV). Scores: each thesis is scored 1-5 on Edge, Materiality,
      Testability and Evidence. The chart shows each side's average per dimension. The bear side
      averages 13.7/20 and the bull side 12.1/20, which is within the symmetry band.
    columns:
      - width: 1.12
        blocks:
          - header: Consensus Baseline
          - bullets:
              - "__Business:__ CFM56 engine-module refurbishment (**87%** of TTM revenue), leasing moving into managed funds (SCI), new data-center gensets"
              - "__Narrative:__ aftermarket compounder taking share, plus an asset-light pivot and a power leg"
              - "__Street:__ **9 Buy / 2 Hold**; mean target **$315.67**; post-Q2 targets $300-375"
              - "__Positioning:__ short interest **10.4%** (from 6.1%); stock **48%** below its Feb high"
              - "__Price implies:__ the **$2.3B** 2027 plan on time, then **+1.9%/yr** forever"
              - "__Live debate:__ is the margin slide (35% to 28.5%) mix or price, and is Power durable?"
      - blocks:
          - header: Average Thesis Score by Dimension (1-5)
          - chart:
              type: bar
              categories: [Edge, Materiality, Testability, Evidence]
              series:
                - {name: "Bear (13.7 / 20)", values: [3.4, 2.4, 4.6, 3.3]}
                - {name: "Bull (12.1 / 20)", values: [2.7, 2.0, 4.3, 3.1]}
              number_format: "0.0"
              value_axis: false
              legend: true
          - callouts:
              - {lead: "Edge to the bear:", text: "its core facts are already reported"}
              - {lead: "Deciding variable:", text: "AP EBITDA margin, next two prints"}

  - type: content
    title: "Bear Case: 10 Theses, Ranked"
    section: Debate
    notes: >-
      Argued as a short-seller who has done the work. Score = Edge + Materiality + Testability +
      Evidence (each 1-5). Ties are broken by Evidence, then Materiality. Consensus to ours shows the
      Street or price view of each thesis's single variable against ours. Full blocks with evidence
      tags, catalysts and dated falsifiers are in FTAI_Bull_Bear_Theses.md.
    blocks:
      - header: "Argued as a short-seller would  |  Scored on Edge, Materiality, Testability, Evidence (max 20)"
      - table:
          columns: ["#", ID, Lens, Thesis, "Consensus → Ours", Score]
          col_widths: [0.45, 0.55, 1.75, 6.35, 2.75, 0.75]
          align: [c, c, l, l, l, c]
          size: 13
          rows:
            - ["1", S4, Macro / policy, "EO 14420 rules could curb Jereh-packaged Power gensets at US data centers", "P(impaired) ~0% → ~25%", "16"]
            - ["2", S2, Profit engine, "AP margin slides to 27% or less in 2027; new volume earns only 22-24%", "29.8% → 27% or less", "15"]
            - ["3", S1, Expectations gap, "A finite CFM56 harvest is worth ~6.5x 2027 EBITDA, not 9.6x", "16.8x → ~6.5x", "15"]
            - ["4", S6, Capital allocation, "2026 Adj. FCF misses: H2 must deliver $623M, 2.4x the first half", "$878M → $750M or less", "14"]
            - ["5", S8, "Revenue: volume", "Leasing/SCI EBITDA of $375M or less in 2027; Q2'26 runs at ~$353M", "$450M → $375M or less", "14"]
            - ["6", S7, Governance, "Affiliate (SCI) maintenance sales pass 25% of AP revenue", "Untracked → 25%+", "14"]
            - ["7", S9, Macro, "CFM56 retirements jump to 3.5%+ in 2028 as LEAP fixes land", "1.5-2% → 3.5%+", "13"]
            - ["8", S3, Optionality, "Power earns $300M or less in 2027: nothing shipped, one customer", "$450M → $300M", "13"]
            - ["9", S10, Moat trajectory, "PMA stalls at 3 of 5 parts, capping the parts-cost edge", "5 of 5 → 4 or fewer", "12"]
            - ["10", S5, Industry structure, "Share stalls at 18% or less as rivals copy the module format", "~20% → 18% or less", "11"]
        height: 3.8
      - callouts:
          - {lead: "Strongest:", text: "S4 is new: an Aug 26, 2026 executive order meets a Chinese partner"}
          - {lead: "Best evidenced:", text: "S2, since the margin slide and 22-24% incremental margins are reported"}

  - type: content
    title: "Bull Case: 10 Theses, Ranked"
    section: Debate
    notes: >-
      Argued as a long PM deciding how much to own. L4 is labeled Consensus (Edge 1) because the Street
      already expects a re-rating; it ranks third on Materiality. Full blocks are in
      FTAI_Bull_Bear_Theses.md.
    blocks:
      - header: "Argued as a long PM would  |  Same scoring; L4 shares the Street's view, so it is labeled Consensus"
      - table:
          columns: ["#", ID, Lens, Thesis, "Consensus → Ours", Score]
          col_widths: [0.45, 0.55, 1.75, 6.35, 2.75, 0.75]
          align: [c, c, l, l, l, c]
          size: 13
          rows:
            - ["1", L3, Industry structure, "CFM56 retirements stay at 2% or less through 2028; GE has cut its view 3 times", "Rising → 2% or less", "14"]
            - ["2", L1, "Revenue: volume", "Share rises from 14% to 22%+ by end-2027 on 3,000 modules of capacity", "~20% → 22%+", "13"]
            - ["3", L4, Expectations gap, "Consensus view: delivering the $2.3B 2027 plan re-rates FTAI to 12x (~$217)", "9.6x → 12x", "13"]
            - ["4", L8, Moat trajectory, "SCI II raises $2B+, widening a captive ~600-engine pool", "Wind-down → $2B+", "13"]
            - ["5", L2, Optionality, "Power earns $600M+ in 2027 as follow-on orders arrive", "$450M → $600M+", "13"]
            - ["6", L7, Profit engine, "PMA and normalizing workscopes lift AP margin back to 31%+ by 2028", "~30% → 31%+", "12"]
            - ["7", L5, Market structure, "Index selling is spent; 10.4% short interest sets up a squeeze", "10.4% → 7% or less", "12"]
            - ["8", L6, Capital allocation, "The $500M buyback retires 3%+ of shares at a 48% drawdown", "Flat → -3% shares", "11"]
            - ["9", L10, Governance, "Accounting overhang fades: odds of a restatement or SEC action 5% or less", "Elevated → 5% or less", "10"]
            - ["10", L9, Macro, "The fuel shock drives 5+ new multi-year airline capacity deals", "Unmodeled → 5+ deals", "10"]
        height: 3.8
      - callouts:
          - {lead: "Strongest:", text: "L3, because GE keeps lowering its CFM56 retirement assumption"}
          - {lead: "Hard data:", text: "share rose from 10% to 14% in two quarters (L1)"}

  - type: content
    title: Top Theses, Catalysts & Falsifiers
    section: Debate
    notes: >-
      Top three per side by score; these carry forward to the evaluation framework (MY_THESIS) and then
      the red-team pass. Value-if-right uses 9.6x 2027 EBITDA and 104M diluted shares.
      Dependency note: S3 and S4 are one bet against Power. S2, S5 and S10 share one driver
      (competitive and OEM pressure). L1, L7 and L9 rest on airlines accepting used/PMA-based modules.
      L4 is the valuation of L1 and L2 being delivered.
    blocks:
      - header: Three Strongest per Side, Each With a Dated Test
      - table:
          columns: [ID, Thesis, "Catalyst & timing", "Falsifier (dated)", "Value if right"]
          col_widths: [0.55, 3.45, 2.65, 4.35, 1.45]
          align: [c, l, l, l, r]
          rows:
            - {cells: ["", "Bear", "", "", ""], style: header}
            - [S4, "EO 14420 curbs Jereh-packaged gensets", "DOE rules due 12/24/26", "DOE exempts behind-the-meter or US-built units by 3/31/27", "-$18 to -$41/sh"]
            - [S2, "AP margin of 27% or less in 2027", "Q3'26 (10/28/26) and Q4'26 prints", "AP margin 30%+ in both Q3'26 and Q4'26 (by 2/28/27)", "-$12/sh"]
            - [S1, "Finite CFM56 harvest: ~6.5x 2027 EBITDA", "GE 2027-28 outlooks; 2028 guide", "$1B+ of 2028+ Power orders or a LEAP plan by 12/31/28", "-40%"]
            - {cells: ["", "Bull", "", "", ""], style: header}
            - [L3, "CFM56 retirements 2% or less to 2028", "GE outlooks, Jan 2027 and Jan 2028", "GE guides 2028 retirements of 3%+ (~1/2028)", "+$21 to +$41/sh"]
            - [L1, "Share from 14% to 22%+ by end-2027", "Q3'26 module count; 2027 guide", "Share below 17% at Q2'27 (reported ~8/2027)", "+$12/sh"]
            - [L4, "Plan delivered, re-rate to 12x (~$217)", "2027 guidance (Feb 2027)", "2027 segment EBITDA guide below $2.1B", "+30%"]
        height: 2.9
      - header: Dependency Check
      - bullets:
          - "S3 and S4 are **one bet against Power**; L4 is just the value of L1 and L2 being delivered"
          - "S2, S5 and S10 share one driver: **competitive and OEM pressure** on FTAI's pricing"

  - type: content
    title: "Debate Map: Where the Two Cases Collide"
    section: Debate
    notes: >-
      Each variable appears in at least one bull and one bear thesis. 'Price implies' comes from the
      reverse DCF or plan arithmetic (2027 share: $4.7B plan AP revenue over a $22-25B market).
      Q3'26 consensus EPS is $1.54 (Earnings Whispers, single source).
    blocks:
      - header: Five Variables Decide the Debate
      - table:
          columns: [Variable, Bull view, Bear view, Consensus, Price implies, "Resolves (when)"]
          col_widths: [2.15, 2.15, 2.3, 1.85, 1.55, 2.7]
          align: [l, l, l, l, l, l]
          size: 12.5
          rows:
            - ["AP EBITDA margin", "31%+ by 2028 (L7)", "27% or less in 2027 (S2)", "29.8% (2027 plan)", "~30%, sustained", "Q3'26 (10/28/26) and Q4'26"]
            - ["2027 Power EBITDA", "$600M+ (L2)", "$300M; policy hit (S3, S4)", "$450M floor", "~$450M", "DOE 12/24/26; Mod-1 3/31/27"]
            - ["FTAI market share", "22%+ by 2027 (L1)", "18% or less (S5)", "~20% (plan)", "~20%", "Q2'27 print (~8/2027)"]
            - ["CFM56 retirement rate", "2% or less to 2028 (L3)", "3.5%+ in 2028 (S9)", "1.5-2% (GE)", "GE's path", "GE outlooks, Jan '27 and '28"]
            - ["EV / 2027 EBITDA", "12x on delivery (L4)", "~6.5x harvest (S1)", "16.8x (Street)", "9.6x", "2027 guide (Feb 2027)"]
        height: 2.0
      - header: Where the Case Stands
      - bullets:
          - "The bear side is modestly stronger (**13.7 vs. 12.1** of 20) because its core facts are already reported"
          - "The decider is **AP EBITDA margin** over the next two prints: it separates mix from price"
          - "Flip to bull: AP margin **30%+** in Q3 and Q4'26 with **300+** modules a quarter, plus benign DOE rules"
      - callouts:
          - {lead: "Next test:", text: "Q3'26 results on 10/28/26 (consensus EPS $1.54)"}
          - {lead: "Policy test:", text: "DOE rules under EO 14420, due 12/24/26"}


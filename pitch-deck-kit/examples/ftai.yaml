  - type: risks
    title: Key Risks to Owning FTAI
    section: Risks
    notes: >-
      Risk levels are judgment calls weighted by probability and value at stake (see the thesis
      scores). Each mitigation names the evidence that would ease the risk, so these double as
      signposts.
    rows:
      - risk: "EO 14420: US policy blocks Jereh-packaged Power gensets"
        level: High
        mitigation: "US assembly of Mod-1 packages, or a DOE carve-out for behind-the-meter units, would neutralize it. Watch DOE rules due 12/24/26 and J&F disclosures."
      - risk: AP margin keeps sliding toward 25%
        level: High
        mitigation: "The last two PMA parts and normalizing workscopes could restore ~30%+. This risk is falsified if AP margin is 30%+ in both Q3 and Q4'26."
      - risk: CFM56 run-off speeds up as LEAP fixes land
        level: Medium
        mitigation: "Share gains (14% toward a 25% target), V2500 work and LEAP entry via SCI (2028-29) extend the runway. A GE 2028 retirement guide of 2.5% or less would ease it."
      - risk: "Earnings quality: affiliate revenue and open litigation"
        level: Medium
        mitigation: "Clean KPMG control opinion and the 2025 Audit Committee review limit accounting risk. Disclosing third-party vs. SCI margins would help most."

  - type: content
    title: "Catalysts & Signposts: What to Watch"
    section: Risks
    notes: >-

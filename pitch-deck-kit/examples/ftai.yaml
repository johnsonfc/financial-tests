  - type: content
    title: "CFM56 Aftermarket: Plateau, Then Run-Off"
    section: Industry
    notes: >-
      Installed base: StandardAero S-1 (~23,000 CFM56 engines). Shop visits and retirements: GE Aerospace
      Q4'25 call (1/22/26), Q2'26 call (7/16/26) and remarks at the Morgan Stanley Laguna conference
      (Sept 2026), via Aviation Week. Chart bars are midpoints of GE's stated ranges (3-4%, 2-3%, ~2%,

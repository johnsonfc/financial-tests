# DKS deck spec, started from the ftai.yaml layout by tools/blank_spec.py, then filled.
#   cd pitch-deck-kit && python3 build_deck.py examples/dks.yaml -o ../DKS_Pitch_Deck.pptx
#
# DICK'S Sporting Goods (NYSE: DKS): bull/bear debate and company evaluation.
# Data as of the Oct 2, 2026 close ($136.08). Figures come from DKS_Company_Evaluation.md
# (sources in its Appendix B), DKS_Bull_Bear_Theses.md and models/dks/run_dks.py.
# Speaker notes name the source for each slide.
# Inline markup:  **bold**   __bold + underline__

title: "DICK'S Sporting Goods - Bull/Bear Debate and Evaluation"
author: Equity Research

brand:
  font: Garamond                 # use "EB Garamond" if the deck will be opened in Google Slides
  target_name: "DICK'S Sporting Goods"
  sponsor_name: Equity Research

sections: [Debate, Company, Industry, Growth Legs, Valuation, Risks]

slides:
  - type: cover
    ticker: "NYSE: DKS"
    kpis: ["Price: $136.08 (Oct 2, 2026)", "Verdict: Pass", "24-Month Value: $172 (+27%)"]
    byline: Bull-Bear Debate and Company Evaluation
    date: Data as of the October 2, 2026 close
    notes: >-
      Verdict: pass. If Foot Locker earns nothing, the $136 price implies a 10.2% DICK'S Business
      margin from FY27; the base case (10.8%, Foot Locker at 2.5% by FY30) is worth ~$163. The
      24-month probability-weighted value is ~$172 (+27% with dividends, ~12.5%/yr), only ~2.5pp a year
      above a ~10% cost of equity. Sources: DKS_Company_Evaluation.md and DKS_Bull_Bear_Theses.md.

  - type: agenda                 # items default to the divider titles below

  # ------------------------------------------------------------------ I. Debate
  - type: divider
    title: "The Debate: Bear vs. Bull"

  - type: content
    title: Consensus Baseline & Scorecard
    section: Debate
    notes: >-
      Consensus: stockanalysis (26 analysts, post-Q2, single source) for the mean target; post-Q2 target
      changes from Stocktwits, MarketBeat and TIKR; short interest from Benzinga (single source).
      Price-implied figures come from the reverse DCF (9% WACC, RONIC 14%, $13.3B EV excluding leases).
      Scores: each thesis is scored 1-5 on Edge, Materiality, Testability and Evidence; the chart shows
      each side's average per dimension. The bear side averages 12.2/20 and the bull side 11.4/20,
      inside the symmetry band.
    columns:
      - width: 1.12
        blocks:
          - header: Consensus Baseline
          - bullets:
              - "__Business:__ the largest US sporting goods retailer (**66%** of FY26 sales) plus Foot Locker (**34%**), bought in Sept 2025"
              - "__Narrative:__ a share-gaining leader whose Foot Locker bet broke in 2026"
              - "__Street:__ mean target **$166** (26 analysts, Buy); post-Q2 targets **$99** to **$205**"
              - "__Positioning:__ short interest **13.7%**; stock **-31%** on Aug 25; insiders buying"
              - "__Price implies:__ Foot Locker at zero and a **10.2%** DICK'S margin (11.2% guided)"
              - "__Live debate:__ a one-season clearance, or a margin reset as Nike floods wholesale again?"
      - blocks:
          - header: Average Thesis Score by Dimension (1-5)
          - chart:
              type: bar
              categories: [Edge, Materiality, Testability, Evidence]
              series:
                - {name: "Bear (12.2 / 20)", values: [2.7, 2.2, 4.2, 3.1]}
                - {name: "Bull (11.4 / 20)", values: [2.3, 2.1, 4.3, 2.7]}
              number_format: "0.0"
              value_axis: false
              legend: true
          - callouts:
              - {lead: "Edge to the bear:", text: "its best claim is in the Q2 numbers"}
              - {lead: "Deciding variable:", text: "the DICK'S margin without refunds"}

  - type: content
    title: "Bear Case: 10 Theses, Ranked"
    section: Debate
    notes: >-
      Argued as a short-seller who has done the work. Score = Edge + Materiality + Testability +
      Evidence (each 1-5). Ties are broken by Evidence, then Materiality, then Edge. Consensus to ours
      shows the Street, guide or price view of each thesis's single variable against ours. Full blocks
      with evidence tags, catalysts and dated falsifiers are in DKS_Bull_Bear_Theses.md.
    blocks:
      - header: "Argued as a short-seller would  |  Scored on Edge, Materiality, Testability, Evidence (max 20)"
      - table:
          columns: ["#", ID, Lens, Thesis, "Consensus → Ours", Score]
          col_widths: [0.45, 0.55, 1.75, 6.35, 2.75, 0.75]
          align: [c, c, l, l, l, c]
          size: 13
          rows:
            - ["1", S1, Profit engine, "DICK'S margin settles near 10.3% once the tariff refund rolls off", "11.0-11.4% → 10.3% or less", "16"]
            - ["2", S8, Expectations gap, "FY27 EPS lands near $12.5; estimates still have to come down", "$15.31 (stale) → $12.5", "14"]
            - ["3", S3, Capital allocation, "Dividends and buybacks exceed FCF; net debt roughly doubles", "Self-funding → $0.3-0.5B gap", "13"]
            - ["4", S2, Industry structure, "Foot Locker earns 0% or less through FY28 in a discounted channel", "~2% → 0% or less", "13"]
            - ["5", S5, Macro / policy, "Section 301 tariffs cost 50-80bp of FY27 gross margin", "Neutral → -50 to -80bp", "12"]
            - ["6", S6, "Revenue: volume", "DICK'S comps slow to +1% or less as transactions turn negative", "+2.5-4.0% → +1% or less", "12"]
            - ["7", S10, Capital allocation, "Group ROIC stays near 10% on ~$1.4B a year of capex", "~14% → 10% or less", "11"]
            - ["8", S9, "Revenue: price / mix", "Ticket growth halves as DKS matches brand promotions", "~+5% → +2% or less", "11"]
            - ["9", S4, Moat trajectory, "Comp premium over Academy shrinks as Nike reopens wholesale", "4pp+ → 2pp or less", "11"]
            - ["10", S7, Governance, "Foot Locker charges exceed the $500-750M plan", "$500-750M → $850M+", "9"]
        height: 3.8
      - callouts:
          - {lead: "Strongest:", text: "S1: a $59M refund hides a ~190bp core margin slide"}
          - {lead: "Already priced:", text: "the price implies a 10.2% DICK'S margin"}

  - type: content
    title: "Bull Case: 10 Theses, Ranked"
    section: Debate
    notes: >-
      Argued as a long PM deciding how much to own. L1 is labeled Consensus (Edge 1) because the Street's
      $166 mean target already sits near the base-case value; it ranks sixth. Full blocks are in
      DKS_Bull_Bear_Theses.md.
    blocks:
      - header: "Argued as a long PM would  |  Same scoring; L1 shares the Street's view, so it is labeled Consensus"
      - table:
          columns: ["#", ID, Lens, Thesis, "Consensus → Ours", Score]
          col_widths: [0.45, 0.55, 1.75, 6.35, 2.75, 0.75]
          align: [c, c, l, l, l, c]
          size: 13
          rows:
            - ["1", L2, Profit engine, "Foot Locker reaches a 3%+ margin by FY28 on synergies and remodels", "-1.2% (price) → 3%+", "14"]
            - ["2", L3, "Revenue: volume", "DICK'S comps run +4% or more as weaker rivals cede share", "+2.5-4.0% → +4%+", "13"]
            - ["3", L4, Moat trajectory, "DICK'S holds 11%+ without refunds: the scale premium survives", "10.2% (price) → 11%+", "13"]
            - ["4", L9, Industry structure, "Nike North America wholesale grows 8%+, feeding both banners", "~+4% → +8%+", "12"]
            - ["5", L8, Market structure, "Short interest falls below 8% of float as estimates trough", "13.7% → below 8%", "12"]
            - ["6", L1, Expectations gap, "Consensus view: the Street's $166 is right; base value ~$163", "-0.3% g (price) → +2.0%", "11"]
            - ["7", L10, "Revenue: price / mix", "Ticket holds +4% as House of Sport and premium mix offset promotions", "~+3% → +4%+", "11"]
            - ["8", L7, Macro / policy, "IEEPA refunds reach $150M+ and fund the Foot Locker reset", "$59M → $150M+", "10"]
            - ["9", L6, Optionality, "Retail media and GameChanger add 50bp+ to the DICK'S margin", "Not modeled → +0.5pp", "9"]
            - ["10", L5, Capital allocation, "Buybacks at ~12x earnings cut shares to 86M or fewer by FY28", "~90M → 86M or fewer", "9"]
        height: 3.8
      - callouts:
          - {lead: "Strongest:", text: "L2, because synergies alone add 1.3-1.7pp"}
          - {lead: "Hard data:", text: "comps +6.0% and +4.9% while Academy was negative (L3)"}

  - type: content
    title: Top Theses, Catalysts & Falsifiers
    section: Debate
    notes: >-
      Top three per side by score; these carry forward as the diligence questions in the thesis file.
      Value-if-right uses the evaluation's sensitivities (DICK'S margin $17/sh per point; Foot Locker
      ~$7/sh per point) and 90.0M diluted shares. Dependency note: S1, S5, S8 and S9 are largely one
      bet on promotional intensity; L2, L3 and L9 lean on Nike's wholesale push.
    blocks:
      - header: Three Strongest per Side, Each With a Dated Test
      - table:
          columns: [ID, Thesis, "Catalyst & timing", "Falsifier (dated)", "Value if right"]
          col_widths: [0.55, 3.45, 2.65, 4.35, 1.45]
          align: [c, l, l, l, r]
          rows:
            - {cells: ["", "Bear", "", "", ""], style: header}
            - [S1, "DICK'S margin near 10.3% in FY27", "Q3 FY26 (late Nov 2026); FY27 guide", "FY27 guide of 11.0%+ without refunds by 3/31/27", "-$12/sh"]
            - [S8, "FY27 EPS near $12.5", "FY27 guide (~Mar 2027)", "FY27 EPS guide midpoint of $14+ by 3/31/27", "-$18/sh"]
            - [S3, "Capital returns exceed FCF", "FY27 capex and buyback guide", "FY27 FCF of $700M+ by 3/31/28", "-$5/sh"]
            - {cells: ["", "Bull", "", "", ""], style: header}
            - [L2, "Foot Locker margin 3%+ by FY28", "Q4 FY26 (~Mar 2027)", "FY27 Foot Locker guide below $100M by 3/31/27", "+$29/sh"]
            - [L3, "DICK'S comps +4%+ in FY27", "Q3 and Q4 FY26 results", "Q4 FY26 DICK'S comp below +2% by 3/31/27", "+$5/sh"]
            - [L4, "DICK'S margin 11%+ without refunds", "FY27 guide (~Mar 2027)", "FY27 guide below 10.5% ex-refunds by 3/31/27", "+$14/sh"]
        height: 2.9
      - header: Dependency Check
      - bullets:
          - "S1, S5, S8 and S9 are largely **one bet on promotions**; S8's EPS gap is mostly S1 plus S2"
          - "L2, L3 and L9 share one upstream driver: **Nike's wholesale push** into both banners"

  - type: content
    title: "Debate Map: Where the Two Cases Collide"
    section: Debate
    notes: >-
      Each variable appears in at least one bull and one bear thesis. 'Price implies' comes from the
      reverse DCF: a 10.2% DICK'S margin if Foot Locker earns 0%, or a -1.2% Foot Locker margin if
      DICK'S follows the base case; perpetual growth after FY27 is -0.3% at a 9% WACC. The Foot Locker
      consensus (~2%) is an estimate of what the $166 mean target needs.
    blocks:
      - header: Five Variables Decide the Debate
      - table:
          columns: [Variable, Bull view, Bear view, Consensus, Price implies, "Resolves (when)"]
          col_widths: [2.15, 2.15, 2.3, 1.85, 1.55, 2.7]
          align: [l, l, l, l, l, l]
          size: 12.5
          rows:
            - ["DICK'S margin ex-refunds", "11%+ in FY27 (L4)", "10.3% or less (S1)", "11.0-11.4% (guide)", "10.2% (FL at 0%)", "FY27 guide (~Mar 2027)"]
            - ["Foot Locker margin, FY28", "3%+ (L2)", "0% or less (S2)", "~2% (Street)", "-1.2%", "Q4 FY26 and FY27 guide"]
            - ["DICK'S comps, FY27", "+4%+ (L3)", "+1% or less (S6)", "+2.5-4.0%", "~0% long-run", "Q4 FY26 (~Mar 2027)"]
            - ["DICK'S average ticket", "+4%+ (L10)", "+2% or less (S9)", "~+5% (Q1)", "n/a", "Q4 FY26 comp detail"]
            - ["Capital returns vs. FCF", "86M shares or fewer (L5)", "$0.3-0.5B gap (S3)", "Self-funding", "n/a", "FY27 guide (~Mar 2027)"]
        height: 2.0
      - header: Where the Case Stands
      - bullets:
          - "The bear side is modestly stronger (**12.2 vs. 11.4** of 20) because its best claim is in the Q2 numbers"
          - "The decider is the **DICK'S margin without refunds**: 10.2% implied vs. 11.0-11.4% guided"
          - "Flip to bull: an FY27 guide with the DICK'S margin at **11%+** ex-refunds and a profitable Foot Locker"
      - callouts:
          - {lead: "Next test:", text: "Q3 FY26 results (late Nov 2026)"}
          - {lead: "Decisive test:", text: "Q4 FY26 and the FY27 guide (~Mar 2027)"}

  # ------------------------------------------------------------------ II. Company
  - type: divider
    title: Company Overview

  - type: content
    title: Company Overview
    section: Company
    notes: >-
      Segment guides: Q2 FY26 8-K (8/25/26), confirmed by Just Style coverage of the business split. Market share: Telsey via Benzinga (2024, single source). House of Sport count:
      Q2 coverage (single source); target: company statements. Deal terms: Q3 FY25 10-Q. Leadership:
      Chain Store Age (Sept 2025). Fiscal calendar: 10-K.
    columns:
      - blocks:
          - header: Background
          - bullets:
              - "DICK'S Sporting Goods (NYSE: DKS); CEO **Lauren Hobart**; Exec. Chairman **Ed Stack** runs Foot Locker"
              - "Largest US sporting goods retailer: ~**9%** share; FY25 sales **$17.2B**"
              - "**House of Sport**: 41 open (Aug 2026); 75-100 targeted"
              - "Bought **Foot Locker** (Sept 2025) for **$2.5B**, mostly in stock (9.6M shares)"
              - "Fiscal years end in late January; FY26 = Feb 2026 to Jan 2027"
      - blocks:
          - header: FY26 Sales Guide by Business ($M)
          - chart:
              type: doughnut
              categories: ["DICK'S Business", Foot Locker Business]
              series: [{name: FY26 sales guide, values: [14600, 7450]}]
              number_format: "#,##0"
              legend: true
              source: Q2 FY26 release and segment guides (midpoints)
            height: 3.7
          - bullets:
              - "Operating income guide: DICK'S **$1.64B**; Foot Locker **-$60M**"
      - blocks:
          - header: Business Lines
          - bullets:
              - "__DICK'S Business:__ DICK'S, House of Sport, Golf Galaxy, Field House; Q2 comps **+4.9%**"
              - "__Foot Locker Business:__ Foot Locker, Kids Foot Locker, Champs, WSS, atmos; Q2 comps **-3.6%**"
              - "__Digital:__ GameChanger (youth sports app) and DICK'S Media Network (retail media)"
              - "__FY26 guide:__ non-GAAP EPS **$11-12**, cut from $13.50-14.50"

  - type: content
    title: Financial Snapshot
    section: Company
    notes: >-
      Market data: close of 10/2/26 (single source; consistent with the 10/1 close); 52-week low from
      MarketBeat-network and Google Finance snippets. Balance sheet: Q2 FY26 10-Q (8/1/26) plus the
      $1.0B of notes settled ~9/25/26; EV excludes operating leases. TTM revenue = FY25 $17.22B less
      H1 FY25 $6.82B plus H1 FY26 $10.75B. FY24 DICK'S operating income = 11.14% of $13.44B (estimate);
      FY25 by business from the FY25 release (single source); FY26 at guidance midpoints. Diluted shares
      = net income / diluted EPS.
    columns:
      - width: 1.0
        blocks:
          - header: Key Metrics (10/2/26)
          - table:
              col_widths: [2.4, 2.1]
              size: 13
              rows:
                - [Share price; 52-week low, "$136.08; ~$120 (9/21/26)"]
                - [Market cap / EV (ex-leases), "$12.2B / $13.3B"]
                - [Net debt / FY26E EBITDA, "$1.0B / 0.5x"]
                - [TTM revenue, "~$21.2B (incl. Foot Locker)"]
                - ["FY26 guide: sales", "$21.9-22.2B"]
                - ["FY26 guide: operating income", "$1.46-1.56B"]
                - [FY25 FCF, "$400M (capex $1.14B)"]
                - [SBC, "0.7% of FY25 sales"]
                - [Diluted shares, "~97M (FY22) to ~90M (FY26)"]
                - [Dividend / yield, "$1.25/qtr; 3.7%"]
                - {cells: [EV / FY26E EBITDA, "6.2x"], style: highlight}
                - {cells: [P/E on FY26 EPS guide ($11.50), "11.8x"], style: highlight}
            height: 4.15
          - callouts:
              - {lead: "FY26 EPS guide", text: "cut 18% on Aug 25, 2026"}
              - {lead: "Capex 2.2x D&A:", text: "~$1.4B in FY26"}
      - width: 1.15
        blocks:
          - header: Non-GAAP Operating Income by Business ($M)
          - chart:
              type: bar
              categories: [FY24, FY25, FY26 Guide]
              series:
                - {name: "DICK'S Business", values: [1497, 1570, 1640]}
                - {name: Foot Locker Business, values: [0, -52, -60]}
              number_format: "#,##0"
              label_format: "#,##0;-#,##0;;"
              value_axis: false
              legend: true
              source: DKS releases; FY24 is DKS alone (11.14% of $13.44B); FY26 at guidance midpoints

  - type: content
    title: "Revenue Engine: Comps Up, Margin Down"
    section: Company
    notes: >-
      Comps: FY23 (+2.4%, single source), FY24 (+5.2%), FY25 (+4.5%), Q1 FY26 (+6.0%) and Q2 FY26 (+4.9%)
      from DKS releases; Q1 ticket +5.5% and transactions +0.5% (single source). Academy: Q2 FY26 release
      (9/9/26). Q2 margin: DICK'S Business segment profit $485.2M on $3.85B (8-K; Pulse2), up from $475M; the $59M
      IEEPA refund is from the Q2 10-Q, and its booking in the DICK'S segment is an assumption. Q2 FY25:
      13.02% non-GAAP operating margin (DKS before Foot Locker).
    columns:
      - blocks:
          - header: "DICK'S Business Comparable Sales (%)"
          - chart:
              type: bar
              categories: [FY23, FY24, FY25, "Q1 FY26", "Q2 FY26"]
              series: [{name: Comparable sales, values: [2.4, 5.2, 4.5, 6.0, 4.9]}]
              number_format: "0.0"
              value_axis: false
              source: DKS releases (FY23 single source)
          - callouts:
              - {lead: "Q1 comp +6.0%:", text: "ticket +5.5%, transactions +0.5%"}
              - {lead: "Academy Q2:", text: "transactions -5.3%, comps -0.4%"}
      - blocks:
          - header: "DICK'S Business Q2 Operating Margin (%)"
          - chart:
              type: line
              categories: ["Q2 FY25", "Q2 FY26", "Q2 FY26 ex-refund"]
              series: [{name: Operating margin, values: [13.0, 12.6, 11.1]}]
              number_format: "0.0"
              source: Q2 FY26 release and 10-Q; refund booking in the segment assumed
          - callouts:
              - {lead: "~190bp slide", text: "once the $59M refund is removed"}
              - {lead: "FY26 guide 11.0-11.4%", text: "includes the refund"}

  - type: content
    title: "Customer & Product: Why Families Buy"
    section: Company
    notes: >-
      Participation and cost: Aspen Institute Project Play (2025). Nike purchases: Fortune (5/19/25, single
      source). Nike Direct: Nike Q1 FY27 release (10/1/26). Academy: FY25 release. Promotion spillover:
      Ed Stack, Q2 FY26 call (8/25/26). The comparison table is a qualitative judgment from the
      evaluation's Sections 2-3.
    columns:
      - blocks:
          - header: The Job
          - bullets:
              - "One trip for equipment, footwear and apparel across **every sport**"
              - "House of Sport: turf, climbing walls and cages make the store a **destination**"
              - Launch access to premium footwear (Nike, On, HOKA)
          - header: What Customers Use Instead
          - bullets:
              - "Brand websites: Nike Direct fell **8%** amid promotions"
              - "Amazon, Walmart, Target; Academy (value, **$6.1B**)"
              - "Sneaker chains: JD's Finish Line and Hibbett"
      - width: 1.25
        blocks:
          - header: "DICK'S vs. the Alternatives"
          - table:
              columns: ["", "DICK'S", Brand site]
              col_widths: [1.9, 1.9, 1.8]
              align: [l, l, l]
              size: 13
              rows:
                - [Assortment, "Every brand", "One brand"]
                - [Service, "Fitting, team gear", "Online returns"]
                - [Price, "Price-matched", "First to discount"]
                - [Youth teams, "GameChanger", "None"]
            height: 1.75
          - callouts:
              - {lead: "58% of kids", text: "play organized sport (2024)"}
              - {lead: "+46% per child:", text: "cost since 2019"}
          - header: Value Chain Position
          - bullets:
              - "Between **Nike** (allocation, launches) and **households**; brands' own promotions spilled into the market in Q2"
      - blocks:
          - header: Who Pays & Decides
          - bullets:
              - "Families and athletes pay; parents decide for **youth sport**"
              - Brands decide what reaches the shelf
              - "DKS + Foot Locker buy ~**$5B** from Nike (~10% of Nike)"
              - "Foot Locker shopper: younger, sneaker-led, mall-based"
          - header: Switching Costs
          - bullets:
              - "~Zero: loyalty is assortment-driven"
              - "GameChanger ties families to DKS **between purchases**"

  - type: content
    title: Capital Allocation & Governance
    section: Company
    notes: >-
      Dividend: declared with Q2 FY26 results. H1 FY26 buybacks and dividends: Q2 10-Q (dividends single
      source). Notes: FWP/424B2 (9/23/26). Capex: Q2 10-Q (~$1.4B net, single source); D&A estimate from
      the model. FY26E FCF is unlevered from models/dks/run_dks.py. Foot Locker consideration: Q3 FY25
      10-Q; charges: CNBC (11/25/25) and the FY25 release. Insider trades: Form 4 summaries
      (InsiderTrades, Quiver, Simply Wall St; several single source). Class B count: Q2 10-Q cover.
    columns:
      - blocks:
          - header: Capital Allocation
          - bullets:
              - "Dividend **$1.25**/qtr (~$450M/yr; 3.7% yield)"
              - "H1 FY26: buybacks **$141M**; dividends **$225M**"
              - "**$1.0B** of new notes (Sept 2026) at 6.2% (2036) and 6.9% (2056)"
              - "Capex **~$1.4B** in FY26, 2.2x D&A"
              - "Foot Locker: **$2.5B** (9.6M shares + cash); $500-750M of charges planned"
          - chart:
              type: bar
              title: FY26 Cash Uses vs. Free Cash Flow ($M)
              categories: [FY25 FCF, FY26E FCF, FY26 dividends, FY26 capex]
              series: [{name: "$M", values: [400, 307, 450, 1400]}]
              number_format: "#,##0"
              value_axis: false
              source: 10-K, 10-Q; FY26E FCF from the model (App. A)
      - blocks:
          - header: Governance & Accounting
          - bullets:
              - "Class B high-vote shares (**23.6M**) give the Stack family control"
              - "Exec. Chairman Ed Stack runs Foot Locker directly"
              - "Non-GAAP excludes **$390M** of FY25 charges yet keeps Q2's **$59M** refund"
              - "Plaintiff-firm investigation notice after Aug 25; no suit confirmed"
          - header: Open-Market Insider Trades
          - table:
              columns: [Date, Insider, Trade, Value]
              col_widths: [1.0, 2.0, 2.4, 0.9]
              align: [l, l, l, r]
              rows:
                - [Sep 2026, CFO N. Gupta, "Bought 7,707 shares", "~$1.0M"]
                - [Sep 2026, Dir. L. Fitzgerald Jr., "Bought 1,860 shares", "$0.24M"]
                - [Aug 2026, Dir. W. Colombo, "Bought 6,100 shares at ~$129", "$0.79M"]
                - [Prior 12 mo., CFO N. Gupta, "Sold shares at ~$222", "~$2.9M"]
            height: 1.6

  # ------------------------------------------------------------------ III. Industry
  - type: divider
    title: Industry & Competition

  - type: content
    title: "Sporting Goods: Slow Growth, Deep Discounts"
    section: Industry
    notes: >-
      Market size: SFIA 2026 report via SGB and SGI Europe. Share: Telsey via Benzinga (2024, single
      source). Nike: Q1 FY27 release (10/1/26); North America wholesale growth from Beancount (single

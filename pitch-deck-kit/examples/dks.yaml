  # ------------------------------------------------------------------ VI. Risks & recommendation
  - type: divider
    title: Risks, Catalysts & Recommendation

  - type: risks
    title: Key Risks to Owning DKS
    section: Risks
    notes: >-
      Risk levels are judgment calls weighted by probability and value at stake (see the thesis
      scores). Each mitigation names the evidence that would ease the risk, so these double as
      signposts.
    rows:
      - risk: "Promotions pull the DICK'S margin toward peers' 7-8.5%"
        level: High
        mitigation: "Retail media, GameChanger and premium mix could hold ~11%. This risk is falsified by an FY27 guide at 11%+ without tariff refunds (~Mar 2027)."
      - risk: Foot Locker stays loss-making as the sneaker channel discounts
        level: High
        mitigation: "$100-125M of synergies and ~250 Fast Break remodels could lift it to 2-3%. Watch the Q4 FY26 segment result and the FY27 Foot Locker guide."
      - risk: "Capital returns outrun FCF; leverage rises on 6-7% debt"
        level: Medium
        mitigation: "Capex should peak near $1.4B in FY26, and BBB / Baa2 ratings leave room. FY27 FCF of $700M+ would ease it."
      - risk: Tariffs return through Section 301 after one-time refunds
        level: Medium
        mitigation: "Direct sourcing and vendor cost-sharing offset part of it. Disclosure of FY27 tariff costs in the guide would size it."

  - type: content
    title: "Catalysts & Signposts: What to Watch"
    section: Risks
    notes: >-
      Thresholds come from the evaluation's signposts and the theses' dated falsifiers. The Q3 FY26 date
      is not yet announced (the Q2 date was set 21 days ahead); Q3 FY25 was reported on 11/25/25. The
      FY27 guide comes with Q4 FY26 results (~mid-March 2027; FY25 was reported 3/12/26).
    blocks:
      - header: Dated Tests Over the Next 18 Months
      - table:
          columns: [Date, Event, Watch for, Tests]
          col_widths: [1.25, 2.6, 6.0, 2.3]
          align: [l, l, l, l]
          size: 13
          rows:
            - ["Late Nov 2026", "Q3 FY26 results", "DICK'S comp +2.5%+; DICK'S margin vs. last year without refunds", "S1, L3, L4"]
            - ["Holiday 2026", "Promotional season", "Brand-site and channel discounting; Nike inventory", "S9, L10"]
            - ["Dec 2026", "Nike Q2 FY27", "North America wholesale +8%+", "L9, S4"]
            - ["~Mar 2027", "Q4 FY26 and FY27 guide", "DICK'S margin 11%+ ex-refunds; Foot Locker profit; EPS $14+", "S1, S8, L2, L4"]
            - ["~Mar 2027", "FY27 capex and buybacks", "Net capex $1.3B or less; FCF covers the dividend", "S3, L5"]
            - ["Quarterly", "Tariff refunds and Section 301", "Cumulative refunds $150M+; gross-margin impact", "L7, S5"]
            - ["Jun 2027", "Short interest", "Below 8% (bull) vs. 12%+ (bear)", "L8"]
            - ["~Mar 2028", "FY27 10-K", "ROIC 12%+; FCF $700M+; charges $750M or less", "S10, S3, S7"]
        height: 3.1
      - callouts:
          - {lead: "Exit any long:", text: "an FY27 DICK'S margin guide below 10% ex-refunds"}
          - {lead: "Turn long:", text: "below ~$123, or an 11%+ margin guide plus a profitable Foot Locker"}

  - type: content
    title: "Final Recommendation: Pass"
    notes: >-
      Pass: base-case value (~$163) is near the Street's $166, but the expected 24-month return (~12.5%/yr
      with dividends) beats a ~10% hurdle by only ~2.5pp, and a 5-point shift of probability from bull to
      bear erases it. Not a short: the price already embeds most of the bear case. The table shows
      base-case intrinsic value per share by WACC and by Foot Locker's steady-state margin.
    columns:
